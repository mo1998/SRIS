# Smart Remote Interview System - Docker Compose Configuration
# Docker-internal URLs are hardcoded; env vars control only secrets/ports.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sris-postgres
    environment:
      POSTGRES_DB: sris_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d sris_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sris-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sris-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Local Qwen/vLLM OpenAI-compatible model server
  local-model:
    image: ${LOCAL_MODEL_IMAGE:-vllm/vllm-openai:latest}
    container_name: sris-local-model
    profiles:
      - model
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --model
      - /models/qwen3-8b-awq
      - --served-model-name
      - ${LOCAL_MODEL_SERVED_NAME:-qwen3-8b-awq}
      - --max-model-len
      - "${LOCAL_MODEL_MAX_MODEL_LEN:-4096}"
      - --gpu-memory-utilization
      - "${LOCAL_MODEL_GPU_MEMORY_UTILIZATION:-0.50}"
      - --max-num-seqs
      - "${LOCAL_MODEL_MAX_NUM_SEQS:-8}"
      - --trust-remote-code
    ports:
      - "${LOCAL_MODEL_PORT:-8100}:8100"
    volumes:
      - ${LOCAL_MODEL_PATH:-./models/qwen3-8b-awq}:/models/qwen3-8b-awq:ro
    networks:
      - sris-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/models', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Backend API
  backend:
    image: sris-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sris-backend
    environment:
      # Docker-internal URLs (hardcoded for container networking)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sris_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      MAILPIT_API_URL: http://mailpit:8025/api/v1/send
      FRONTEND_URL: http://localhost:8081
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS_DOCKER:-["http://localhost","http://localhost:80","http://frontend","http://localhost:3000","http://localhost:5173"]}
      # App config
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      DEBUG: ${DEBUG:-True}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@sris.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SRIS}
      EVALUATION_QUEUE_BACKEND: rq
      EVALUATION_QUEUE_NAME: ${EVALUATION_QUEUE_NAME:-evaluation}
      EVALUATION_PROVIDER: ${EVALUATION_PROVIDER:-deterministic_baseline}
      EVALUATION_PROMPT_VERSION: ${EVALUATION_PROMPT_VERSION:-rubric-v1}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://local-model:8100/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3-8b-awq}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-5}
      CLOUD_LLM_ENABLED: ${CLOUD_LLM_ENABLED:-false}
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-https://api.openai.com/v1}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-gpt-4o-mini}
      CLOUD_LLM_API_KEY: ${CLOUD_LLM_API_KEY:-}
      CLOUD_LLM_TIMEOUT_SECONDS: ${CLOUD_LLM_TIMEOUT_SECONDS:-20}
      EMOTION_ANALYSIS_PROVIDER: ${EMOTION_ANALYSIS_PROVIDER:-deepface}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-whisper}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - sris-network
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; conn = http.client.HTTPConnection('localhost:8000'); conn.request('GET', '/health'); resp = conn.getresponse(); exit(0 if resp.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Mailpit - Email testing UI
  mailpit:
    image: axllent/mailpit:latest
    container_name: sris-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - sris-network
    restart: unless-stopped

  # RQ Worker for AI evaluation
  evaluation-worker:
    image: sris-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sris-evaluation-worker
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sris_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      EVALUATION_PROVIDER: ${EVALUATION_PROVIDER:-deterministic_baseline}
      EVALUATION_QUEUE_BACKEND: rq
      EVALUATION_QUEUE_NAME: ${EVALUATION_QUEUE_NAME:-evaluation}
      EVALUATION_PROMPT_VERSION: ${EVALUATION_PROMPT_VERSION:-rubric-v1}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://local-model:8100/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3-8b-awq}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-5}
      CLOUD_LLM_ENABLED: ${CLOUD_LLM_ENABLED:-false}
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-https://api.openai.com/v1}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-gpt-4o-mini}
      CLOUD_LLM_API_KEY: ${CLOUD_LLM_API_KEY:-}
      CLOUD_LLM_TIMEOUT_SECONDS: ${CLOUD_LLM_TIMEOUT_SECONDS:-20}
      EMOTION_ANALYSIS_PROVIDER: ${EMOTION_ANALYSIS_PROVIDER:-deepface}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-whisper}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sris-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    profiles:
      - worker

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sris-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - sris-network
    restart: unless-stopped

  # Database Migration Service (runs once on startup)
  db-migrate:
    image: sris-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sris-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sris_db
      SECRET_KEY: ${SECRET_KEY:-ci-test-secret-key-not-for-production}
      DEBUG: "True"
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sris-network
    volumes:
      - backend_uploads:/app/uploads
    restart: "no"

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

# Networks
networks:
  sris-network:
    driver: bridge
