# Production Docker Compose with SSL support

services:
  postgres:
    image: postgres:15-alpine
    container_name: sris-postgres-prod
    environment:
      POSTGRES_DB: sris_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sris-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d sris_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: sris-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - sris-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sris-backend-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sris_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: False
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SRIS}
      MAILPIT_API_URL: ${MAILPIT_API_URL:-}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      EVALUATION_QUEUE_BACKEND: rq
      EVALUATION_QUEUE_NAME: ${EVALUATION_QUEUE_NAME:-evaluation}
      EVALUATION_PROVIDER: ${EVALUATION_PROVIDER:-deterministic_baseline}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
      CLOUD_LLM_ENABLED: ${CLOUD_LLM_ENABLED:-false}
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-https://api.openai.com/v1}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-gpt-4o-mini}
      CLOUD_LLM_API_KEY: ${CLOUD_LLM_API_KEY:-}
      CLOUD_LLM_TIMEOUT_SECONDS: ${CLOUD_LLM_TIMEOUT_SECONDS:-20}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sris-network
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; conn = http.client.HTTPConnection('localhost:8000'); conn.request('GET', '/health'); resp = conn.getresponse(); exit(0 if resp.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  evaluation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sris_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY}
      EVALUATION_PROVIDER: ${EVALUATION_PROVIDER:-deterministic_baseline}
      EVALUATION_QUEUE_BACKEND: rq
      EVALUATION_QUEUE_NAME: ${EVALUATION_QUEUE_NAME:-evaluation}
      EVALUATION_PROMPT_VERSION: ${EVALUATION_PROMPT_VERSION:-rubric-v1}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://local-model:8100/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3-8b-awq}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-5}
      CLOUD_LLM_ENABLED: ${CLOUD_LLM_ENABLED:-false}
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-https://api.openai.com/v1}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-gpt-4o-mini}
      CLOUD_LLM_API_KEY: ${CLOUD_LLM_API_KEY:-}
      CLOUD_LLM_TIMEOUT_SECONDS: ${CLOUD_LLM_TIMEOUT_SECONDS:-20}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SRIS}
      EMOTION_ANALYSIS_PROVIDER: ${EMOTION_ANALYSIS_PROVIDER:-deepface}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-whisper}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sris-network
    restart: always
    deploy:
      replicas: ${EVALUATION_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # Optional local vLLM OpenAI-compatible model server.
  # Requires an NVIDIA GPU. Enabled via ENABLE_LOCAL_LLM=true (deploy.sh adds
  # the 'local-llm' profile automatically). Not exposed to the host; only the
  # backend and evaluation-worker reach it on the compose network.
  local-model:
    image: ${LOCAL_MODEL_IMAGE:-vllm/vllm-openai:latest}
    container_name: sris-local-model-prod
    profiles: ["local-llm"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --model
      - /models/${LOCAL_MODEL_SERVED_NAME:-qwen3-8b-awq}
      - --served-model-name
      - ${LOCAL_MODEL_SERVED_NAME:-qwen3-8b-awq}
      - --max-model-len
      - "${LOCAL_MODEL_MAX_MODEL_LEN:-4096}"
      - --gpu-memory-utilization
      - "${LOCAL_MODEL_GPU_MEMORY_UTILIZATION:-0.50}"
      - --max-num-seqs
      - "${LOCAL_MODEL_MAX_NUM_SEQS:-8}"
      - --trust-remote-code
    volumes:
      - ${LOCAL_MODEL_PATH:-./models/qwen3-8b-awq}:/models/qwen3-8b-awq:ro
    networks:
      - sris-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/v1/models', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sris-frontend-prod
    environment:
      DOMAIN: ${DOMAIN:-sris.example.com}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE:-/etc/letsencrypt/live/${DOMAIN:-sris.example.com}/fullchain.pem}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY:-/etc/letsencrypt/live/${DOMAIN:-sris.example.com}/privkey.pem}
    volumes:
      - ./docker/nginx/nginx-prod.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - sris-network
    ports:
      - "80:80"
      - "443:443"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  certbot:
    image: certbot/certbot
    container_name: sris-certbot-prod
    profiles: ["certbot"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_lib:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - sris-network
    restart: "no"

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sris-migrate-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sris_db
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sris-network
    deploy:
      replicas: 1

  # =====================================================================
  # Observability (Phase 4): Prometheus + Grafana + Loki
  # Enabled via the 'observability' profile (default on; set
  # ENABLE_OBSERVABILITY=false in .env to skip on constrained hosts).
  # Grafana binds to 127.0.0.1 by default — reach it via an SSH tunnel.
  # =====================================================================

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: sris-node-exporter-prod
    profiles: ["observability"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - sris-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sris-prometheus-prod
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-30}d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sris-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sris-alertmanager-prod
    # Only started when SLACK_WEBHOOK_URL is configured (deploy.sh adds the
    # 'alerts' profile). Alertmanager refuses to start with an empty api_url,
    # so it is kept out of the default observability profile.
    profiles: ["alerts"]
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - sris-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  loki:
    image: grafana/loki:2.9.6
    container_name: sris-loki-prod
    profiles: ["observability"]
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - sris-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  promtail:
    image: grafana/promtail:2.9.6
    container_name: sris-promtail-prod
    profiles: ["observability"]
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      loki:
        condition: service_started
    networks:
      - sris-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sris-grafana-prod
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks:
      - sris-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  certbot_conf:
    driver: local
  certbot_lib:
    driver: local
  certbot_www:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

networks:
  sris-network:
    driver: bridge
