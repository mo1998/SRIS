name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest backend/tests -q -n auto

      - name: Validate migrations
        working-directory: backend
        env:
          DEBUG: 'True'
          SECRET_KEY: test-secret-key-for-migration-check
          DATABASE_URL: sqlite:////tmp/sris-ci-migration-check.db
        run: |
          rm -f /tmp/sris-ci-migration-check.db
          python -m alembic upgrade head

  frontend:
    name: Frontend Tests And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run tests
        run: npm run test:run --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run release candidate E2E smoke
        run: npm run test:e2e --prefix frontend

  docker-compose:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: sris-backend:latest
          cache-from: type=gha,scope=sris-backend
          cache-to: type=gha,mode=max,scope=sris-backend

      - name: Build and start services
        run: |
          docker compose up -d postgres redis mailpit
          echo "Waiting for postgres and redis to be healthy..."
          timeout 60 bash -c '
            until docker compose exec -T postgres pg_isready -U postgres 2>/dev/null; do sleep 2; done
          '
          echo "Running migrations..."
          docker compose run --rm db-migrate 2>&1
          echo "Starting backend..."
          docker compose up -d backend
          echo "Waiting for backend to be healthy..."
          timeout 120 bash -c '
            until docker compose exec -T backend python -c "import http.client; conn = http.client.HTTPConnection(\"localhost:8000\"); conn.request(\"GET\", \"/health\"); resp = conn.getresponse(); exit(0 if resp.status == 200 else 1)" 2>/dev/null; do
              sleep 5
            done
          '
          echo "Backend is healthy!"

      - name: Smoke test API
        run: |
          BACKEND_URL="http://localhost:$(docker compose port backend 8000 | cut -d: -f2)"
          echo "Backend available at $BACKEND_URL"
          curl -sf "$BACKEND_URL/health" | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='healthy'; print('API health OK')"
          curl -sf "$BACKEND_URL/api/auth/register" -X POST -H "Content-Type: application/json" -d '{"email":"ci@test.com","password":"Strong-password1","full_name":"CI Test","role":"employer","company_name":"CI Test Co"}' | python -c "import sys,json; d=json.load(sys.stdin); assert d['email']=='ci@test.com'; print('User creation OK')"
          echo "API smoke test passed!"

      - name: Validate Compose Config
        run: docker compose config

      - name: Cleanup
        if: always()
        run: docker compose down -v
